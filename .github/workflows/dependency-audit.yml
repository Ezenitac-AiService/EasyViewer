# Weekly advisory check. New RustSec/npm advisories can turn `main` red without any code change and
# block the release gate (FR-025 item 4); this surfaces them early. Failures notify the maintainer.
name: Dependency Audit

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - name: RustSec advisories (cargo-deny)
        working-directory: src-tauri
        run: cargo deny check advisories

  npm-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Production npm advisories (high and above)
        run: npm audit --omit=dev --audit-level=high
