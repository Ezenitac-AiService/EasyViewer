# Tag release for the supported platforms only (spec 003 contracts/release-and-ci.md §2).
# gate (FR-025, before any build) → macOS/Linux/Android builds → publish (artifact gate, checksums).
# Rehearsal runs only from workflow_dispatch, never from a tag push, and only creates a draft.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release. A rehearsal tag must end with -rehearsal.'
        required: true
        type: string
      rehearsal:
        description: 'Rehearsal: maintainer items become warnings and only a [REHEARSAL] draft is created'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      rehearsal: ${{ steps.mode.outputs.rehearsal }}
      android: ${{ steps.android.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve tag and mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$GITHUB_REF_NAME"; REHEARSAL=false
          else
            TAG="$INPUT_TAG"; REHEARSAL="${INPUT_REHEARSAL:-false}"
          fi
          if [ "$REHEARSAL" = "true" ] && [[ "$TAG" != *-rehearsal ]]; then
            echo "::error::A rehearsal tag must end with -rehearsal"; exit 1
          fi
          if [ "$REHEARSAL" != "true" ] && [[ "$TAG" == *-rehearsal ]]; then
            echo "::error::A -rehearsal tag can only be used with rehearsal=true"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$REHEARSAL" >> "$GITHUB_OUTPUT"
      # Constitution v4.3.0: Android ships only when it can be signed with the fork key; without the key
      # it is left out of the release, never debug-signed. Only a boolean leaves the secret context.
      - name: Decide whether Android is part of this release
        id: android
        shell: bash
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          REHEARSAL: ${{ steps.mode.outputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" = "true" ] || [ "$REHEARSAL" = "true" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Android signing key is not registered; this release leaves Android out"
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release gate before any build (FR-025 1–5, 8, version, versionCode)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          REHEARSAL: ${{ steps.mode.outputs.rehearsal }}
          ANDROID: ${{ steps.android.outputs.android }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$REHEARSAL" = "true" ]; then EXTRA="$EXTRA --rehearsal"; fi
          if [ "$ANDROID" != "true" ]; then EXTRA="$EXTRA --without-android"; fi
          # shellcheck disable=SC2086 # EXTRA holds fixed flags only
          node scripts/check-release-gate.mjs --release --tag "$TAG" --phase prebuild $EXTRA

  build-desktop:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_cmd: npm run mac:build
            bundle_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            build_cmd: npx tauri build --bundles deb,rpm,appimage
            bundle_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          prefix-key: ${{ matrix.name }}-rust
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Build Tauri bundle (${{ matrix.name }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_BUILD_CMD: ${{ matrix.build_cmd }}
        run: node scripts/ci-build-desktop.mjs
      - name: Verify macOS bundle signature and DMG integrity
        if: matrix.name == 'macos-universal'
        run: |
          codesign --verify --deep --strict -vvv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  build-android:
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform, build-tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          PACKAGES="$(sdkmanager --list | awk '{print $1}')"
          NDK="$(printf '%s\n' "$PACKAGES" | grep -E '^ndk;2[78]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          PLATFORM="$(printf '%s\n' "$PACKAGES" | grep -E '^platforms;android-3[67](\.0)?$' | sort -V | tail -n 1)"
          BUILD_TOOLS="$(printf '%s\n' "$PACKAGES" | grep -E '^build-tools;3[67]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          sdkmanager "platform-tools" "$PLATFORM" "$BUILD_TOOLS" "$NDK"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          prefix-key: android-rust
      - run: npm ci
      - run: npm run android:init
        env:
          CI: 'true'
      # Spike S4: init must not rewrite the committed identifier and release-signing setup.
      - name: Committed Android project is unchanged by init
        run: git diff --exit-code -- src-tauri/gen/android
      - name: Build arm64 APK signed with the fork release key
        shell: bash
        env:
          CI: 'true'
          REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pagelight-release.keystore"' EXIT
          SUFFIX=""
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pagelight-release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pagelight-release.keystore"
            npm run android:release
          elif [ "$REHEARSAL" = "true" ]; then
            echo "::warning::No signing secrets: the rehearsal APK is debug-signed and named -rehearsal"
            npm run android:build
            SUFFIX="-rehearsal"
          else
            echo "::error::Android signing secrets are missing (see docs/android-signing.md)"
            exit 1
          fi
          echo "APK_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
      - name: Stage versioned Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then echo "No Android APK produced" >&2; exit 1; fi
          mkdir -p dist-android
          cp "$APK" "dist-android/Pagelight_${VERSION}_android-arm64${APK_SUFFIX}.apk"
          ls -lh dist-android
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-android-arm64
          path: dist-android/*.apk
          if-no-files-found: error

  publish:
    needs: [gate, build-desktop, build-android]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' && needs.build-desktop.result == 'success' &&
      (needs.build-android.result == 'success' ||
      (needs.build-android.result == 'skipped' && needs.gate.outputs.android == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Collect artifacts, refuse Windows files, write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          if find release-artifacts -type f | grep -Eiq '\.(exe|msi)$|windows|portable\.zip$'; then
            echo "::error::Windows artifacts are not published by this fork (FR-008)"; exit 1
          fi
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets
      - name: Release gate on the artifacts (FR-025 6–7)
        shell: bash
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          ANDROID: ${{ needs.gate.outputs.android }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$ANDROID" != "true" ]; then EXTRA="--without-android"; fi
          # shellcheck disable=SC2086 # EXTRA holds fixed flags only
          node scripts/check-release-gate.mjs --release --tag "$TAG" --phase publish --assets release-assets $EXTRA
      - name: Release notes (note when Android is left out)
        shell: bash
        env:
          ANDROID: ${{ needs.gate.outputs.android }}
        run: |
          set -euo pipefail
          cp .github/release-notes.md "$RUNNER_TEMP/release-notes.md"
          if [ "$ANDROID" != "true" ]; then
            {
              echo
              echo "> **Android**: 이번 릴리스에는 Android APK가 없습니다. 포크 소유 서명 키가 준비된 릴리스부터 제공합니다."
              echo "> This release has no Android APK. It will be provided from the release where the fork signing key is ready."
            } >> "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = "true" ]; then
            gh release create "$TAG" release-assets/* \
              --title "[REHEARSAL] Pagelight $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" --draft --prerelease
            exit 0
          fi
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" release-assets/* \
            --title "Pagelight $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${PRERELEASE[@]}"
