name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish assets to (default: v<package.json version>)'
        required: false
        type: string
      publish_release:
        description: 'Attach built installers and APKs to the GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run verify

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_cmd: npm run mac:build
            bundle_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_cmd: npx tauri build --bundles nsis
            bundle_path: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            build_cmd: npx tauri build --bundles deb,appimage
            bundle_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: ${{ matrix.name }}-rust
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build Tauri bundle (${{ matrix.name }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ${{ matrix.build_cmd }}
      - name: Verify macOS bundle signature and DMG integrity
        if: matrix.name == 'macos-universal'
        run: |
          codesign --verify --deep --strict -vvv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform, build-tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          SDK_LIST="$(sdkmanager --list)"
          LATEST_NDK="$(printf '%s\n' "$SDK_LIST" | grep -oE 'ndk;28\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)"
          if [ -z "$LATEST_NDK" ]; then
            LATEST_NDK="$(printf '%s\n' "$SDK_LIST" | grep -oE 'ndk;27\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
          fi
          LATEST_PLATFORM="$(printf '%s\n' "$SDK_LIST" | grep -oE 'platforms;android-37(\.0)?' | sort -V | head -n 1 || true)"
          if [ -z "$LATEST_PLATFORM" ]; then
            LATEST_PLATFORM="$(printf '%s\n' "$SDK_LIST" | grep -oE 'platforms;android-36(\.0)?' | sort -V | head -n 1)"
          fi
          LATEST_BUILD_TOOLS="$(printf '%s\n' "$SDK_LIST" | grep -oE 'build-tools;3[67]\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
          sdkmanager "platform-tools" "$LATEST_PLATFORM" "$LATEST_BUILD_TOOLS" "$LATEST_NDK"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          NDK_VER="${LATEST_NDK#ndk;}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: android-rust
      - run: npm ci
      - name: Initialize Android project and build arm64 release APK
        env:
          CI: 'true'
        run: |
          npm run android:init
          npm run android:release
      - name: Stage versioned Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist-android
          FOUND=0
          while IFS= read -r -d '' apk; do
            cp "$apk" "dist-android/EasyViewer_${VERSION}_android-arm64.apk"
            FOUND=1
            break
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z)
          if [ "$FOUND" -eq 0 ]; then
            echo "No Android APK produced" >&2
            exit 1
          fi
          ls -lh dist-android
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-android-arm64
          path: dist-android/*.apk
          if-no-files-found: error

  publish-release:
    needs: [build-desktop, build-android]
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish multi-platform assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release-assets/ \;
          ls -lh release-assets

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          elif [ -n "$PRERELEASE_FLAG" ]; then
            gh release create "$TAG" release-assets/* \
              --title "EasyViewer $TAG" \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" release-assets/* \
              --title "EasyViewer $TAG" \
              --generate-notes
          fi
