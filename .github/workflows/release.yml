# Tag release for the supported platforms only (spec 003 contracts/release-and-ci.md §2,
# spec 004 contracts/release-test-builds.md §1).
# gate (FR-025, before any build) → build-macos (core) + build-linux/build-android (test builds)
# → publish (-test names, notes, checksums, artifact gate). A failed test build only drops that platform;
# a failed macOS build stops the release. Rehearsal runs only from workflow_dispatch and only creates a draft.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release. A rehearsal tag must end with -rehearsal.'
        required: true
        type: string
      rehearsal:
        description: 'Rehearsal: maintainer items become warnings and only a [REHEARSAL] draft is created'
        required: false
        default: false
        type: boolean
      fail_linux:
        description: 'Rehearsal only: make build-linux fail on purpose to check that the release continues without it'
        required: false
        default: false
        type: boolean
      fail_android:
        description: 'Rehearsal only: make build-android fail on purpose to check that the release continues without it'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      rehearsal: ${{ steps.mode.outputs.rehearsal }}
      has_key: ${{ steps.key.outputs.has_key }}
      linux: ${{ steps.gate.outputs.linux }}
      android: ${{ steps.gate.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve tag and mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
          FAIL_LINUX: ${{ inputs.fail_linux }}
          FAIL_ANDROID: ${{ inputs.fail_android }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$GITHUB_REF_NAME"; REHEARSAL=false
          else
            TAG="$INPUT_TAG"; REHEARSAL="${INPUT_REHEARSAL:-false}"
          fi
          if [ "$REHEARSAL" = "true" ] && [[ "$TAG" != *-rehearsal ]]; then
            echo "::error::A rehearsal tag must end with -rehearsal"; exit 1
          fi
          if [ "$REHEARSAL" != "true" ] && [[ "$TAG" == *-rehearsal ]]; then
            echo "::error::A -rehearsal tag can only be used with rehearsal=true"; exit 1
          fi
          if [ "$REHEARSAL" != "true" ] && { [ "$FAIL_LINUX" = "true" ] || [ "$FAIL_ANDROID" = "true" ]; }; then
            echo "::error::fail_linux and fail_android are rehearsal-only inputs"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$REHEARSAL" >> "$GITHUB_OUTPUT"
      # Constitution v6.1.0: Android ships only when it can be signed with the fork key; without the key
      # it is left out of the release, never debug-signed. Only a boolean leaves the secret context.
      - name: Check whether the Android signing key is registered
        id: key
        shell: bash
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Android signing key is not registered; a release leaves Android out"
          fi
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
      # The gate also stops after three consecutive test-build omissions and decides, from
      # .github/release-exclusions.json and the key, whether build-linux and build-android run.
      - name: Release gate before any build (FR-025 1–5, 8, version, versionCode, test builds)
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          REHEARSAL: ${{ steps.mode.outputs.rehearsal }}
          HAS_KEY: ${{ steps.key.outputs.has_key }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$REHEARSAL" = "true" ]; then EXTRA="$EXTRA --rehearsal"; fi
          if [ "$HAS_KEY" != "true" ] && [ "$REHEARSAL" != "true" ]; then EXTRA="$EXTRA --without-android"; fi
          # shellcheck disable=SC2086 # EXTRA holds fixed flags only
          node scripts/check-release-gate.mjs --release --tag "$TAG" --phase prebuild $EXTRA | tee "$RUNNER_TEMP/gate.out"
          grep -E '^(linux|android)=(true|false)$' "$RUNNER_TEMP/gate.out" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          prefix-key: macos-universal-rust
      - run: npm ci
      - name: Build Tauri bundle (macos-universal)
        env:
          MATRIX_NAME: macos-universal
          MATRIX_BUILD_CMD: npm run mac:build
        run: node scripts/ci-build-desktop.mjs
      - name: Verify macOS bundle signature and DMG integrity
        run: |
          codesign --verify --deep --strict -vvv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Test build (constitution v6.1.0): a failure here leaves Linux out of the release, nothing more.
  build-linux:
    needs: gate
    if: needs.gate.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          prefix-key: linux-x64-rust
      - name: 'Rehearsal: fail on purpose (fail_linux)'
        if: inputs.fail_linux == true
        run: |
          echo "::warning::fail_linux=true: build-linux fails on purpose"
          exit 1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Build Tauri bundle (linux-x64)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MATRIX_NAME: linux-x64
          MATRIX_BUILD_CMD: npx tauri build --bundles deb,rpm,appimage
        run: node scripts/ci-build-desktop.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Test build (constitution v6.1.0): fork-key signed only (debug signing only in a rehearsal).
  build-android:
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 'Rehearsal: fail on purpose (fail_android)'
        if: inputs.fail_android == true
        run: |
          echo "::warning::fail_android=true: build-android fails on purpose"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform, build-tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          PACKAGES="$(sdkmanager --list | awk '{print $1}')"
          NDK="$(printf '%s\n' "$PACKAGES" | grep -E '^ndk;2[78]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          PLATFORM="$(printf '%s\n' "$PACKAGES" | grep -E '^platforms;android-3[67](\.0)?$' | sort -V | tail -n 1)"
          BUILD_TOOLS="$(printf '%s\n' "$PACKAGES" | grep -E '^build-tools;3[67]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          sdkmanager "platform-tools" "$PLATFORM" "$BUILD_TOOLS" "$NDK"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          prefix-key: android-rust
      - run: npm ci
      - run: npm run android:init
        env:
          CI: 'true'
      # Spike S4: init must not rewrite the committed identifier and release-signing setup.
      - name: Committed Android project is unchanged by init
        run: git diff --exit-code -- src-tauri/gen/android
      - name: Build arm64 APK signed with the fork release key
        shell: bash
        env:
          CI: 'true'
          REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pagelight-release.keystore"' EXIT
          SUFFIX=""
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pagelight-release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pagelight-release.keystore"
            npm run android:release
          elif [ "$REHEARSAL" = "true" ]; then
            echo "::warning::No signing secrets: the rehearsal APK is debug-signed and named -rehearsal"
            npm run android:build
            SUFFIX="-rehearsal"
          else
            echo "::error::Android signing secrets are missing (see docs/android-signing.md)"
            exit 1
          fi
          echo "APK_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
      - name: Stage versioned Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then echo "No Android APK produced" >&2; exit 1; fi
          mkdir -p dist-android
          cp "$APK" "dist-android/Pagelight_${VERSION}_android-arm64${APK_SUFFIX}.apk"
          ls -lh dist-android
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-android-arm64
          path: dist-android/*.apk
          if-no-files-found: error

  publish:
    needs: [gate, build-macos, build-linux, build-android]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Collect artifacts and refuse Windows files
        shell: bash
        run: |
          set -euo pipefail
          if find release-artifacts -type f | grep -Eiq '\.(exe|msi)$|windows|portable\.zip$'; then
            echo "::error::Windows artifacts are not published by this fork (FR-008)"; exit 1
          fi
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release-assets/ \;
      - name: Mark Linux and Android files as test builds (-test, rehearsal APK -test-rehearsal)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in release-assets/*.deb release-assets/*.rpm release-assets/*.AppImage release-assets/*.apk; do
            case "$f" in
              *-rehearsal.apk) mv "$f" "${f%-rehearsal.apk}-test-rehearsal.apk" ;;
              *) mv "$f" "${f%.*}-test.${f##*.}" ;;
            esac
          done
          ls -lh release-assets
      - name: Release notes with the test-build section and omission notices
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.build-linux.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          HAS_KEY: ${{ needs.gate.outputs.has_key }}
          REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
        run: |
          set -euo pipefail
          REASON=""
          if [ "$ANDROID_RESULT" = "skipped" ] && [ "$HAS_KEY" != "true" ] && [ "$REHEARSAL" != "true" ]; then
            REASON="no-signing-key"
          fi
          node scripts/release-notes.mjs --base .github/release-notes.md --linux-result "$LINUX_RESULT" --android-result "$ANDROID_RESULT" \
            --android-reason "$REASON" --out "$RUNNER_TEMP/release-notes.md"
      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Release gate on the artifacts and notes (FR-025 6–7, test builds)
        shell: bash
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          ANDROID: ${{ needs.gate.outputs.android }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$ANDROID" != "true" ]; then EXTRA="--without-android"; fi
          # shellcheck disable=SC2086 # EXTRA holds fixed flags only
          node scripts/check-release-gate.mjs --release --tag "$TAG" --phase publish --assets release-assets \
            --notes "$RUNNER_TEMP/release-notes.md" --linux-result "$LINUX_RESULT" --android-result "$ANDROID_RESULT" $EXTRA
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = "true" ]; then
            gh release create "$TAG" release-assets/* \
              --title "[REHEARSAL] Pagelight $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" --draft --prerelease
            exit 0
          fi
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" release-assets/* \
            --title "Pagelight $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${PRERELEASE[@]}"
