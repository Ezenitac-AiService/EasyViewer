name: 기능 제안
description: 이 포크에 바라는 기능을 제안해 주세요.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
  - type: dropdown
    id: platforms
    attributes:
      label: 관련 플랫폼
      multiple: true
      options:
        - macOS
        - iOS
        - Linux
        - Android
