[package]
name = "pagelight"
version = "1.0.0-alpha.2"
description = "심플한 Text, EPUB 범용 문서 뷰어"
authors = ["Pagelight contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/Ezenitac-AiService/EasyViewer"
edition = "2021"
publish = false

[lib]
name = "pagelight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-keyring-store = "0.3.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
dunce = "1.0.5"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

