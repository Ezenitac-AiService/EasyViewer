  <g stroke="#fef3c7" stroke-width="18" stroke-linecap="round">
    <line x1="752" y1="178" x2="752" y2="200"/>
    <line x1="752" y1="336" x2="752" y2="358"/>
    <line x1="662" y1="268" x2="684" y2="268"/>
