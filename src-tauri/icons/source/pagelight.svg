    <rect x="370" y="560" width="220" height="26" rx="13" fill="#0f766e" opacity="0.55"/>
    <rect x="370" y="630" width="250" height="26" rx="13" fill="#0f766e" opacity="0.55"/>
  </g>
  <!-- small light spark -->
